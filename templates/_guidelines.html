<div id="guidelines-list">
  {% if guidelines %}
  <ul class="space-y-2">
    {% for g in guidelines %}
    <li id="guideline-{{ g.id }}" class="text-sm bg-slate-50 border border-slate-200 rounded-md px-3 py-2">
      <div class="flex items-start justify-between gap-2">
        <span><span class="text-slate-400 mr-1 font-medium">{{ loop.index }}.</span>{{ g.text }}</span>
        <div class="flex gap-1 shrink-0 mt-0.5">
          <button
            hx-get="/admin/guidelines/{{ g.id }}/edit"
            hx-target="#guideline-{{ g.id }}"
            hx-swap="outerHTML"
            class="text-xs text-indigo-500 hover:text-indigo-700 px-1.5 py-0.5 rounded hover:bg-indigo-50">Edit</button>
          <button
            hx-post="/admin/guidelines/{{ g.id }}/delete"
            hx-confirm="Delete guideline {{ loop.index }}?"
            hx-target="#guidelines-list"
            hx-swap="outerHTML"
            class="text-xs text-red-400 hover:text-red-600 px-1.5 py-0.5 rounded hover:bg-red-50">Del</button>
        </div>
      </div>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-sm text-slate-400">No guidelines yet.</p>
  {% endif %}
</div>
