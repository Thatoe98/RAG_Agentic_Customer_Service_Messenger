<li id="guideline-{{ g.id }}" class="text-sm bg-white border border-indigo-300 rounded-md px-3 py-2">
  <form
    hx-post="/admin/guidelines/{{ g.id }}/update"
    hx-target="#guidelines-list"
    hx-swap="outerHTML">
    <textarea name="text" rows="3"
              class="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-2 resize-none">{{ g.text }}</textarea>
    <div class="flex gap-2 justify-end">
      <button type="button"
        hx-get="/admin/guidelines"
        hx-target="#guidelines-list"
        hx-swap="outerHTML"
        class="text-xs text-slate-500 hover:text-slate-700 px-2 py-1 rounded hover:bg-slate-100">Cancel</button>
      <button type="submit"
        class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded">Save</button>
    </div>
  </form>
</li>
